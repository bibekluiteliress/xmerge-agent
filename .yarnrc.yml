changesetBaseRefs:
  - main

compressionLevel: mixed

defaultSemverRangePrefix: ''

enableGlobalCache: false

enableTelemetry: false

nmMode: hardlinks-local

nodeLinker: node-modules

npmAlwaysAuth: true

npmAuditRegistry: 'https://iress.jfrog.io/artifactory/api/npm/iress-npm'

npmAuthIdent: '${ARTIFACTORY_USERNAME:-}'

npmAuthToken: '${ARTIFACTORY_ACCESS_TOKEN:-}'

npmRegistryServer: 'https://iress.jfrog.io/artifactory/api/npm/iress-npm'

supportedArchitectures:
  cpu: [arm64, x64]
  os: [darwin, linux, win32]

yarnPath: .yarn/releases/yarn-4.10.3.cjs
